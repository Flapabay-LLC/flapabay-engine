server {
    listen 80;
    server_name localhost api.local.flapabay.com;
    root /var/www/html/public;
    index index.php index.html;

    # Security Headers (relaxed for local)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip Configuration
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Client Max Body Size
    client_max_body_size 100M;

    # Static Files (no caching for local development)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Laravel Application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Processing
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # FastCGI Configuration
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # WebSocket Proxy for Laravel Reverb
    location /app/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Health Check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Laravel Telescope (for local debugging)
    location /telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel Horizon (for queue monitoring)
    location /horizon {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Debug endpoints (local only)
    location /debug {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel logs viewer (local only)
    location /logs {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hide sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # Logs (verbose for local development)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;
}