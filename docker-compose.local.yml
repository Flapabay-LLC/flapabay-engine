version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: flapabay_app_local
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Mount source code for live editing
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      # Cache directories
      - laravel_cache:/var/www/html/bootstrap/cache
      - laravel_storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-flapabay_local}
      - DB_USERNAME=${DB_USERNAME:-flapabay_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - BROADCAST_CONNECTION=reverb
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_HOST=localhost
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - MAIL_MAILER=log
    depends_on:
      - db
      - redis
    networks:
      - flapabay_local_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: flapabay_nginx_local
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - flapabay_local_network

  db:
    image: mysql:8.0
    container_name: flapabay_db_local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-flapabay_local}
      MYSQL_USER: ${DB_USERNAME:-flapabay_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    volumes:
      - mysql_local_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # Initialize with sample data
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "33060:3306"
    networks:
      - flapabay_local_network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: flapabay_redis_local
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_local_data:/data
    ports:
      - "6379:6379"
    networks:
      - flapabay_local_network

  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64
    container_name: flapabay_mailhog_local
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - flapabay_local_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: flapabay_phpmyadmin_local
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-flapabay_user}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - flapabay_local_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    container_name: flapabay_redis_commander_local
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - flapabay_local_network

volumes:
  mysql_local_data:
    driver: local
  redis_local_data:
    driver: local
  nginx_logs:
    driver: local
  laravel_cache:
    driver: local
  laravel_storage:
    driver: local

networks:
  flapabay_local_network:
    driver: bridge